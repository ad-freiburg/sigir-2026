[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reviews"
version = "0.1.0"
description = "PDF review script using OpenAI GPT-4 API for generating structured academic paper reviews"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "argcomplete>=3.0.0",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
]

[project.scripts]
review = "review:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
py-modules = ["review"]
include-package-data = true
