[project]
name = "openreview-client"
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "openreview-py",
    "argcomplete",
    "numpy",
    "openai",
    "reportlab",
    "python-dotenv",
]

[project.scripts]
orsig = "orsig.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
